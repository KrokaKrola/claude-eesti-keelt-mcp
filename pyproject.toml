[project]
name = "anki-vocab"
version = "0.1.0"
description = "Локальный MCP-сервер: словарный запас из Anki для генерации примеров на знакомой лексике"
requires-python = ">=3.12"
dependencies = [
    "estnltk>=1.7.5",
    "mcp>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_vocab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
